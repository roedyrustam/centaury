name: 🐛 Bug Report
description: Create a report to help us fix a bug in Centaury
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: Centaury & Bun Version
      description: What versions are you running? (e.g., Centaury 1.0.0-alpha, Bun 1.3.14)
      placeholder: "Centaury v1.0.0-alpha, Bun v1.3.14"
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Affected Package
      description: Which subpackage is affected?
      options:
        - "@centaury/core (Micro-Kernel & Router)"
        - "@centaury/signals (Zero-Hydration Reactivity)"
        - "@centaury/ephemeral (Generative UI Synthesizer)"
        - "@centaury/astra (Multimodal Astra Gateway)"
        - "@centaury/agent (Dual-Citizen MCP v1.x Server)"
        - "@centaury/cli (CLI & Scaffolding)"
        - "Showcase App / Examples"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior. Minimal reproduction code is highly appreciated.
      placeholder: |
        1. Run 'centaury create test-app'
        2. Execute ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
